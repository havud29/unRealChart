<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The query is a cache buster, and it earns its keep. Browsers keep
      favicons in a store of their own that a reload does not touch and a hard
      reload usually does not either, so changing the file is not enough to
      change the icon anyone sees. Bump this whenever the mark changes.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>unRealChart</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
