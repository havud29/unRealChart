<!--
  The mark: uR, the opening of unRealChart.

  Two letters, not three. At sixteen pixels, which is what a browser tab
  actually gives you, `uRC` merges into a smudge: three glyphs share about
  twelve usable pixels and none of them survives. Two letters hold, and the
  pair is distinctive enough to be this app and not another.

  The R takes the accent so the mark is not a flat block of text, and the dark
  ground is there because a tab sits on chrome that may be light or dark: paper
  on ink reads against both, where ink on paper vanishes into a light toolbar.

  Note for editing: this comment may not contain a double hyphen. XML forbids
  it, the whole file fails to parse, and the only symptom is a tab with no icon
  rather than an error anyone would notice.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="unRealChart">
  <rect width="32" height="32" rx="7" fill="#23201c" />
  <text
    x="16"
    y="23.5"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="21"
    font-weight="800"
    letter-spacing="-1"
  >
    <tspan fill="#faf9f5">u</tspan><tspan fill="#d97757">R</tspan>
  </text>
</svg>
